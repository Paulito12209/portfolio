<div class="input-container">
    <input type="text"
        [placeholder]="isInvalid ? ('CONTACT.ERROR_NAME' | translate) : ('CONTACT.FORM_NAME' | translate)"
        [ngModel]="name" (ngModelChange)="onInputChange($event)" #nameModel="ngModel" (blur)="onBlur()"
        [class.invalid]="isInvalid" [class.invalid-placeholder]="isInvalid" name="name">
</div>
