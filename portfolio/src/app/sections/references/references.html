<div class="references-container">
    <div class="references-content">
        <!-- Mobile Header (ersetzt Titel) -->
        <div class="references-mobile-header">
            <h4>{{ 'REFERENCES.MOBILE_H4' | translate }}</h4>
            <div class="horizontal-line"></div>
            <p>{{ 'REFERENCES.MOBILE_P' | translate }}</p>
        </div>

        <app-section-content headline="REFERENCES.TITLE" class="hide-title-mobile">
            <div class="references-list" #referencesList>
                <app-reference-details [person]="references[0].person" [project]="references[0].project"
                    [description]="references[0].description">
                </app-reference-details>
                <app-reference-details [person]="references[1].person" [project]="references[1].project"
                    [description]="references[1].description">
                </app-reference-details>
                <app-reference-details [person]="references[2].person" [project]="references[2].project"
                    [description]="references[2].description" [scrollable]="true">
                </app-reference-details>
            </div>

            <!-- Karussell Navigation (nur Mobile) -->
            <div class="carousel-dots">
                <button *ngFor="let ref of references; let i = index" class="dot" [class.active]="activeIndex === i"
                    (click)="scrollToCard(i)" [attr.aria-label]="'Gehe zu Referenz ' + (i + 1)">
                </button>
            </div>
        </app-section-content>
    </div>
    <div class="references-bow">
        <app-section-bow (arrowClick)="scrollToContact()"></app-section-bow>
    </div>
</div>
